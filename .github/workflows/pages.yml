name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - coverage/**
      - .github/workflows/pages.yml
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Discover DuckDB branches
        id: duckdb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api repos/duckdb/duckdb --jq .default_branch)"
          duckdb_branches="$(
            gh api --paginate repos/duckdb/duckdb/branches --jq '.[].name' | sort -u
          )"
          supported_branches=()
          default_branch_supported=false
          while IFS= read -r branch; do
            if [[ "$branch" == "main" || "$branch" =~ ^v([2-9]|[1-9][0-9]+)\.[0-9]+-[[:alnum:]_.-]+$ ]]; then
              supported_branches+=("$branch")
              if [[ "$branch" == "$default_branch" ]]; then
                default_branch_supported=true
              fi
            fi
          done <<< "$duckdb_branches"

          if [[ "$default_branch_supported" != "true" ]]; then
            echo "DuckDB default branch '$default_branch' is not a supported coverage branch" >&2
            exit 1
          fi

          {
            echo "default_branch=$default_branch"
            echo "branches<<EOF"
            printf '%s\n' "${supported_branches[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare site
        env:
          DEFAULT_BRANCH: ${{ steps.duckdb.outputs.default_branch }}
          DUCKDB_BRANCHES: ${{ steps.duckdb.outputs.branches }}
        run: |
          set -euo pipefail

          mkdir -p _site/coverage
          while IFS= read -r branch; do
            if [[ -z "$branch" ]]; then
              continue
            fi
            mkdir -p "_site/coverage/$branch"
            cp -R coverage/. "_site/coverage/$branch/"
          done <<< "$DUCKDB_BRANCHES"

          cat > _site/coverage/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>DuckDB coverage</title>
          </head>
          <body>
            <script>
              window.location.replace("./$DEFAULT_BRANCH/" + window.location.search + window.location.hash);
            </script>
            <p><a href="./$DEFAULT_BRANCH/">Open the DuckDB coverage report</a></p>
          </body>
          </html>
          EOF

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
