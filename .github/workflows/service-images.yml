name: Service images

# Not part of ci.yml: its jobs need namespace.so runners, and these images must also build in a fork.
on:
  pull_request:
    paths:
      - docker/service/**
      - .github/workflows/service-images.yml
  push:
    branches:
      - main
    paths:
      - docker/service/**
      - .github/workflows/service-images.yml
  workflow_dispatch:
    inputs:
      service:
        description: Service to build (empty = all)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    outputs:
      image_version: ${{ steps.config.outputs.image_version }}
      image_suffix: ${{ steps.config.outputs.image_suffix }}
      services: ${{ steps.config.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_INPUT: ${{ inputs.service }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          image_version="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          image_suffix="_dev"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            image_suffix=""
          fi

          all=()
          for dir in docker/service/*/; do
            if [[ -f "${dir}Dockerfile" ]]; then
              all+=("$(basename "${dir}")")
            fi
          done

          selected=()
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${SERVICE_INPUT}" ]]; then
              selected=("${all[@]}")
            elif [[ " ${all[*]} " == *" ${SERVICE_INPUT} "* ]]; then
              selected=("${SERVICE_INPUT}")
            else
              echo "::error::Unknown service '${SERVICE_INPUT}'; known: ${all[*]}"
              exit 1
            fi
          else
            # HEAD of a pull request is its merge commit, whose first parent is the base.
            base="HEAD^1"
            if [[ "${EVENT_NAME}" == "push" ]]; then
              base="${PUSH_BEFORE}"
            fi
            if changed="$(git diff --name-only "${base}" HEAD)"; then
              if grep -qxE 'docker/service/build\.sh|\.github/workflows/service-images\.yml' <<<"${changed}"; then
                selected=("${all[@]}")
              else
                for service in "${all[@]}"; do
                  if grep -q "^docker/service/${service}/" <<<"${changed}"; then
                    selected+=("${service}")
                  fi
                done
              fi
            else
              echo "::warning::Cannot diff against '${base}'; building all services"
              selected=("${all[@]}")
            fi
          fi

          services="$(jq -cn '$ARGS.positional' --args "${selected[@]}")"
          echo "Services to build: ${services}"
          {
            echo image_version="${image_version}"
            echo image_suffix="${image_suffix}"
            echo services="${services}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}

    env:
      SERVICE: ${{ matrix.service }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
      IMAGE_SUFFIX: ${{ needs.prepare.outputs.image_suffix }}
      REPO_PREFIX: ghcr.io/${{ github.repository_owner }}/duckdb-ci
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      # The token of a pull request from another repository, or from dependabot, cannot write packages.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The default docker driver cannot build a multi-platform image.
      - name: Create buildx builder
        run: docker buildx create --use

      - name: Build and smoke test
        run: |
          set -euo pipefail
          ./docker/service/build.sh "${SERVICE}" | tee "${RUNNER_TEMP}/built.txt"
          # Both tags of a version name one image; test it once.
          grep -- "-${IMAGE_VERSION}\$" "${RUNNER_TEMP}/built.txt" | while read -r ref; do
            "./docker/service/${SERVICE}/smoke.sh" "${ref}"
          done

      - name: Login to GHCR
        if: ${{ env.CAN_PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: ${{ env.CAN_PUSH == 'true' }}
        env:
          PLATFORMS: linux/amd64,linux/arm64
          PUSH: '1'
        run: |
          set -euo pipefail
          ./docker/service/build.sh "${SERVICE}" | tee "${RUNNER_TEMP}/pushed.txt"

          while read -r ref; do
            docker buildx imagetools inspect --format '{{json .Manifest}}' "${ref}" \
              | jq -e --arg want "${PLATFORMS}" \
                '[.manifests[]?.platform | "\(.os)/\(.architecture)"] as $have | ($want / ",") - $have == []' >/dev/null \
              || { echo "::error::${ref} does not hold all of ${PLATFORMS}"; exit 1; }
          done < "${RUNNER_TEMP}/pushed.txt"

          {
            echo "### Pushed ${SERVICE} (${PLATFORMS})"
            echo
            sed -e 's/^/- `/' -e 's/$/`/' "${RUNNER_TEMP}/pushed.txt"
          } >> "$GITHUB_STEP_SUMMARY"
