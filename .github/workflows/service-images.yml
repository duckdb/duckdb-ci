name: Service images

# Not part of ci.yml: its jobs need namespace.so runners, and these images must also build in a fork.
on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/service-images.yml
  push:
    branches:
      - main
    paths:
      - docker/**
      - .github/workflows/service-images.yml
  workflow_dispatch:
    inputs:
      service:
        description: Service to build (empty = all)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    outputs:
      image_version: ${{ steps.config.outputs.image_version }}
      image_suffix: ${{ steps.config.outputs.image_suffix }}
      services: ${{ steps.config.outputs.services }}
      can_push: ${{ steps.config.outputs.can_push }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_INPUT: ${{ inputs.service }}
          PUSH_BEFORE: ${{ github.event.before }}
          # The token of a pull request from another repository, or from dependabot, cannot write packages.
          CAN_PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          set -euo pipefail

          image_version="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          image_suffix="_dev"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            image_suffix=""
          fi

          all=()
          for versions in docker/*/versions; do
            all+=("$(basename "$(dirname "${versions}")")")
          done

          selected=()
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${SERVICE_INPUT}" ]]; then
              selected=("${all[@]}")
            elif [[ " ${all[*]} " == *" ${SERVICE_INPUT} "* ]]; then
              selected=("${SERVICE_INPUT}")
            else
              echo "::error::Unknown service '${SERVICE_INPUT}'; known: ${all[*]}"
              exit 1
            fi
          else
            # HEAD of a pull request is its merge commit, whose first parent is the base.
            base="HEAD^1"
            if [[ "${EVENT_NAME}" == "push" ]]; then
              base="${PUSH_BEFORE}"
            fi
            if changed="$(git diff --name-only "${base}" HEAD)"; then
              if grep -qxE 'docker/(build|merge)_service\.sh|\.github/workflows/service-images\.yml' <<<"${changed}"; then
                selected=("${all[@]}")
              else
                for service in "${all[@]}"; do
                  if grep -q "^docker/${service}/" <<<"${changed}"; then
                    selected+=("${service}")
                  fi
                done
              fi
            else
              echo "::warning::Cannot diff against '${base}'; building all services"
              selected=("${all[@]}")
            fi
          fi

          services="$(jq -cn '$ARGS.positional' --args "${selected[@]}")"
          echo "Services to build: ${services}"
          {
            echo image_version="${image_version}"
            echo image_suffix="${image_suffix}"
            echo services="${services}"
            echo can_push="${CAN_PUSH}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.service }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.services != '[]' }}
    # A first build of a service that compiles its upstream has no layer cache.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      SERVICE: ${{ matrix.service }}
      ARCH: ${{ matrix.arch }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
      IMAGE_SUFFIX: ${{ needs.prepare.outputs.image_suffix }}
      REPO_PREFIX: ghcr.io/${{ github.repository_owner }}/duckdb-ci
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The default docker driver cannot write a registry cache.
      - name: Create buildx builder
        run: docker buildx create --use

      - name: Login to GHCR
        if: ${{ needs.prepare.outputs.can_push == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke test
        run: |
          set -euo pipefail
          ./docker/build_service.sh "${SERVICE}" | tee "${RUNNER_TEMP}/built.txt"
          while read -r ref; do
            "./docker/${SERVICE}/smoke.sh" "${ref}"
          done < "${RUNNER_TEMP}/built.txt"

      # The builder still holds every layer of the build above; this run only pushes.
      - name: Push
        if: ${{ needs.prepare.outputs.can_push == 'true' }}
        env:
          PUSH: '1'
        run: ./docker/build_service.sh "${SERVICE}"

  merge:
    name: Merge (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    # Not success(): a service whose builds passed is published also when another service failed.
    # merge.sh fails for a service that lacks the image of one architecture.
    if: ${{ !cancelled() && needs.prepare.outputs.can_push == 'true' && needs.prepare.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}

    env:
      SERVICE: ${{ matrix.service }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
      IMAGE_SUFFIX: ${{ needs.prepare.outputs.image_suffix }}
      REPO_PREFIX: ghcr.io/${{ github.repository_owner }}/duckdb-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the architectures
        run: |
          set -euo pipefail
          ./docker/merge_service.sh "${SERVICE}" | tee "${RUNNER_TEMP}/merged.txt"
          {
            echo "### Pushed ${SERVICE} (linux/amd64, linux/arm64)"
            echo
            sed -e 's/^/- `/' -e 's/$/`/' "${RUNNER_TEMP}/merged.txt"
          } >> "$GITHUB_STEP_SUMMARY"
