# Example configuration for the DuckDB benchmark harness.
# Run with: python3 run_benchmark.py --config config.yaml

# Recorded as a column in the results CSV to identify this run.
benchmark_name: my_first_benchmark

# The DuckDB CLI used to run the queries. Two forms are accepted:
#   - a path to an existing CLI executable (e.g. a local build), used as-is, or
#   - a pinned release version such as v1.5.5, installed once via the official DuckDB
#     install script and cached at ~/.duckdb/cli/<version>/duckdb (floating refs like
#     "latest" are not accepted).
duckdb_binary: v1.5.5
# Storage the queries run against. Two types are supported:
#   type: duckdb    -> path is a DuckDB database file, opened directly.
#   type: ducklake  -> path is a DuckLake target (a local .ducklake metadata file or a
#                      connection string such as postgres:...), attached before queries.
storage:
  type: duckdb
  path: benchmark/tpcds-sf001.duckdb

# Directory of benchmark queries, one statement per qNN.sql file.
queries: benchmark/queries

# Directory of expected answers, one qNN.csv per query (pipe-delimited, with header).
answers: benchmark/answers

# Output CSV. Each query runs in one subprocess: a cold run to warm caches (not recorded)
# plus 10 timed warm runs. A query that fails (wrong result, timeout, or error) is recorded
# with status=failed and skipped, and the run continues. Columns:
#   benchmark_name,query,status,error,median_seconds,run_1_seconds,...,run_10_seconds
results: benchmark/results.csv

# Optional: per query run timeout in seconds (default: 600).
timeout: 600

# Optional: DuckDB settings applied via the CLI before each query runs.
# Omit either to leave DuckDB at its default.
threads: 4              # SET threads = 4;
memory_limit: 4GB       # SET memory_limit = '4GB';
