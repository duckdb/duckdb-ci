# Unity Catalog server config of the test image: local filesystem, no cloud credentials, no auth.

server.env=dev

# One default principal, no tokens.
server.authorization=disable

# The schema duck.cmt holds MANAGED tables.
server.managed-table.enabled=true

# No storage-root.tables on purpose. The schema duck.cmt has its own
# storage_root (<data dir>/duck/cmt), and its tables and the __unitystorage tree
# of UC go under it. The EXTERNAL tables of duck.plain bring their own location
# under <data dir>/duck/plain. That is a sibling of the cmt storage, not under or
# above it, so no external location needs to be registered.
